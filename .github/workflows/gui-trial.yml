name: GUI trial (temporary)

on:
  push:
    branches: [claude/nice-archimedes-v6vmk9]

permissions:
  contents: read

jobs:
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TwinRails --icon packaging/twinrails.ico
          --hidden-import pystray._win32
          --hidden-import PIL._tkinter_finder
          --collect-all curl_cffi
          main.py
      - name: Launch in demo mode, then screenshot
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TwinRails.exe -ArgumentList '--demo','--bar' -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 25
          "bootloader alive after 25s: $(-not $p.HasExited)"
          if ($p.HasExited) { "exit code: $($p.ExitCode)" }
          Get-Process TwinRails -ErrorAction SilentlyContinue | Format-Table Id, Responding, MainWindowTitle -AutoSize | Out-String -Width 200
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "screen: $($b.Width)x$($b.Height)"
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\screen.png")
          $strip = $bmp.Clone((New-Object System.Drawing.Rectangle 0, ($b.Height - 80), $b.Width, 80), $bmp.PixelFormat)
          $strip.Save("$PWD\taskbar.png")
          Get-ChildItem "$env:USERPROFILE\.ai_session_limits" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Stop-Process -Name TwinRails -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: gui-trial
          path: |
            screen.png
            taskbar.png
